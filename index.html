<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1746d1">
  <title>Livestream Archive — THE BOYZ ARCHIVE</title>
  <meta name="description" content="Fan-made archive of THE BOYZ livestreams from 2017 onwards.">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="top">
    <header class="masthead">
      <div class="utility"><a class="brand" href="../the-boyz-archive/index.html">THE BOYZ / FAN ARCHIVE</a><nav><a class="twitter-link" href="https://x.com/tbzarchive1206_" target="_blank" rel="noopener noreferrer" aria-label="THE BOYZ Archive on Twitter">TWITTER ↗</a></nav></div>
      <h1><span class="solid">LIVESTREAMS</span><span class="outline">ARCHIVE</span></h1>
      <div class="stats"><p><strong id="totalCount">1,562</strong> STREAMS</p><i></i><p>2017—<strong id="lastYear">2026</strong></p><i></i><p>UPDATED <strong id="updatedDate">2026</strong></p></div>
    </header>

    <section class="controls" aria-label="Archive controls">
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="SEARCH TITLES, MEMBERS..." autocomplete="off"></label>
      <button class="filters-toggle" id="filtersToggle" type="button" aria-expanded="true"><span>☷</span> FILTERS <b>⌃</b></button>
      <div class="filter-row" id="filterRow">
        <label>YEAR<select id="yearFilter"><option value="all">ALL YEARS</option></select></label>
        <label>MEMBER<select id="memberFilter"><option value="all">ALL MEMBERS</option></select></label>
        <label>PLATFORM<select id="platformFilter"><option value="all">ALL PLATFORMS</option></select></label>
      </div>
      <div class="year-tabs" id="yearTabs" aria-label="Filter by year"></div>
    </section>

    <section class="archive-section">
      <div class="results-head"><p id="resultsLabel">ALL STREAMS</p><div class="view-switch" aria-label="Display style"><button class="selected" id="gridView" type="button" aria-label="Grid view">▦</button><button id="listView" type="button" aria-label="List view">☷</button></div></div>
      <div class="cards" id="cards" aria-live="polite"></div>
      <div class="empty" id="empty" hidden><span>NO RESULTS</span><p>Try changing the search or filters.</p></div>
      <button class="load-more" id="loadMore" type="button">LOAD MORE <span>↓</span></button>
    </section>

    <footer><a href="../the-boyz-archive/index.html">← MAIN ARCHIVE</a><a href="#top">BACK TO TOP ↑</a></footer>
  </main>
  <dialog class="player-dialog" id="playerDialog" aria-labelledby="playerTitle">
    <div class="player-shell">
      <header class="player-head"><div><span>WATCH LIVESTREAM</span><h2 id="playerTitle">LIVESTREAM</h2></div><button id="closePlayer" type="button" aria-label="Close video player">×</button></header>
      <div class="player-frame"><iframe id="youtubePlayer" title="YouTube livestream player" src="about:blank" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
    </div>
  </dialog>
  <script src="data/livestreams.js"></script>
  <script src="app.js"></script>
</body>
</html>
