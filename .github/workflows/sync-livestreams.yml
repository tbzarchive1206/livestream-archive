name: Sync Livestreams from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: livestream-sync-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install workbook reader
        run: pip install openpyxl==3.1.5

      - name: Download public Google Sheets workbook
        env:
          GOOGLE_SHEET_ID: 1GmZQa24xkS7cPjhWgwYOXGc4SxwR9Eev-eN6rlWRk90
        run: >-
          python scripts/download_workbook.py
          --sheet-id "$GOOGLE_SHEET_ID"
          --destination "$RUNNER_TEMP/Livestreams.xlsx"
          --attempts 5
          --timeout 300

      - name: Generate archive data
        run: python scripts/update_livestreams.py --source "$RUNNER_TEMP/Livestreams.xlsx"

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/livestreams.js; then
            echo "No changes found."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/livestreams.js
            git commit -m "Update Livestream archive data"
            git push
          fi

      - name: Prepare website
        run: |
          mkdir _site
          cp index.html app.js styles.css icon.png _site/
          cp -r data _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
